[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "screen-bridge"
version = "0.1.0"
description = "Live Windows screen state and grounded computer tools for AI assistants"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.18,<2",
  "mss>=10,<11",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "rapidocr-onnxruntime>=1.4,<2",
  "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
]

[project.scripts]
screen-bridge = "screen_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/screen_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
